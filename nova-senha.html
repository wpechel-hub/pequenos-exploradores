<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B1E4B">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exploradores">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pequenos Exploradores</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>.card{max-width:440px;margin:30px auto}.card h1{font-size:30px;margin-bottom:6px}.card .btn{width:100%;margin-top:16px}</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="/"><img src="/favicon.svg" alt=""><span data-i18n="brand"></span></a><div class="topr" id="topr"></div></header>
  <form class="card" id="form" novalidate>
    <h1 data-i18n="rs.title"></h1>
    <label for="pass" data-i18n="rs.new"></label>
    <input id="pass" type="password" autocomplete="new-password" minlength="6" required>
    <button class="btn main" id="go" type="submit" data-i18n="rs.save" disabled></button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</div>
<script type="module">
import { sb } from "/js/sb.js";
import { t, applyI18n, langPicker, errMsg } from "/js/i18n.js";
applyI18n();
document.getElementById("topr").appendChild(langPicker());
const $ = (id) => document.getElementById(id);
const msg = (s, ok) => { $("msg").textContent = s || ""; $("msg").className = "msg " + (s ? (ok ? "ok" : "err") : ""); };
let client;
(async () => {
  try { client = await sb(); } catch (e) { msg(t("m.config")); return; }
  let ready = false;
  const enable = () => { ready = true; $("go").disabled = false; };
  client.auth.onAuthStateChange((ev, s) => { if (s && (ev === "PASSWORD_RECOVERY" || ev === "SIGNED_IN")) enable(); });
  const { data: { session } } = await client.auth.getSession();
  if (session) enable();
  setTimeout(() => { if (!ready) msg(t("rs.invalid")); }, 4000);
})();
$("form").onsubmit = async (ev) => {
  ev.preventDefault();
  const password = $("pass").value;
  if (password.length < 6) return msg(t("m.shortPass"));
  $("go").disabled = true;
  const { error } = await client.auth.updateUser({ password });
  if (error) { msg(errMsg(error)); $("go").disabled = false; return; }
  msg(t("rs.ok"), true);
  setTimeout(() => location.replace("/app"), 1200);
};
</script>
<script type="module" src="/js/pwa.js"></script>
</body>
</html>
