<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B1E4B">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exploradores">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>30 dias no corpo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFEFEA; --ink:#3A1730; --soft:#7A4A63; --card:#FFFFFF; --line:#F4CFC7;
  --sky:#5B1A3A; --sun:#FFC93C; --coral:#FF6F7F; --mint:#3CC8A4; --lav:#8C7BFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#24101C;--ink:#FFEFF4;--soft:#E2B8C9;--card:#3A1A2C;--line:#5E2E48}
}
:root[data-theme="dark"]{--bg:#24101C;--ink:#FFEFF4;--soft:#E2B8C9;--card:#3A1A2C;--line:#5E2E48}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,.baloo{font-family:"Baloo 2","Nunito",system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header.hero{background:var(--sky);color:#fff;border-radius:28px;overflow:hidden;position:relative}
header.hero svg{display:block;width:100%;height:auto}
header.hero .txt{position:absolute;left:20px;bottom:18px;right:20px}
header.hero h1{font-size:clamp(32px,8.5vw,54px);font-weight:800;letter-spacing:-.5px}
header.hero p{margin:4px 0 0;color:#FFD6E2;font-size:16px;max-width:30ch}
.progress{display:flex;align-items:center;gap:12px;margin:20px 4px 10px}
.bar{flex:1;height:14px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .4s}
.progress b{font-family:"Baloo 2",sans-serif;font-size:18px;white-space:nowrap}
.hint{color:var(--soft);font-size:15px;margin:0 4px 16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(6,1fr)}}
.day{appearance:none;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:"Baloo 2",sans-serif;padding:0;position:relative}
.day .n{font-size:24px;font-weight:800;line-height:1}
.day .e{font-size:14px;line-height:1}
.day.done{background:var(--sky);border-color:var(--coral);color:#FFD6E2}
.day.done::after{content:"♥";position:absolute;top:-6px;right:-4px;font-size:18px;color:var(--coral)}
.day.next{border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 30%,transparent)}
.day:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.sheet{position:fixed;inset:0;background:rgba(40,10,25,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--card);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:28px}}
.art{background:var(--sky);position:relative}
.art svg{display:block;width:100%;height:auto}
.art .badge{position:absolute;top:14px;left:14px;background:var(--sun);color:#5B1A3A;font-family:"Baloo 2",sans-serif;font-weight:800;border-radius:20px;padding:2px 14px;font-size:17px}
.close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;cursor:pointer}
.body{padding:18px 20px 4px}
.body h2{font-size:30px;font-weight:800;margin-bottom:8px}
.fact{font-size:19px;margin:0 0 10px}
.extra{color:var(--soft);margin:0 0 18px}
.box{border-radius:20px;padding:14px 16px;margin-bottom:14px}
.box h3{font-size:21px;margin-bottom:6px}
.act{background:color-mix(in srgb,var(--mint) 16%,var(--card));border:2px solid var(--mint)}
.exp{background:color-mix(in srgb,var(--coral) 13%,var(--card));border:2px solid var(--coral)}
.more{margin:0 0 18px;padding-left:0;list-style:none}
.more li{position:relative;padding-left:26px;margin-bottom:8px}
.more li::before{content:"♥";position:absolute;left:2px;color:var(--coral);font-size:18px;line-height:1.3}
.more-t{font-size:21px;margin:0 0 8px}
.ask{background:color-mix(in srgb,var(--lav) 14%,var(--card));border:2px dashed var(--lav)}
.mat{font-size:15px;color:var(--soft);margin:0 0 6px}
ol{margin:0;padding-left:22px}
ol li{margin-bottom:4px}
.row{display:flex;gap:10px;padding:6px 20px 0;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:0;border-radius:18px;padding:14px;font-family:"Baloo 2",sans-serif;font-size:19px;font-weight:700;cursor:pointer}
.btn.main{background:var(--sun);color:#5B1A3A}
.btn.sec{background:var(--line);color:var(--ink)}
.namebox{display:flex;align-items:center;gap:10px;margin:0 4px 16px;flex-wrap:wrap}
.namebox label{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:18px}
.namebox input{flex:1;min-width:160px;font:inherit;font-size:18px;border:0;border-bottom:3px solid var(--coral);background:transparent;color:var(--ink);padding:6px 4px}
.certbtn{display:block;width:100%;margin-top:22px}
.finale{position:fixed;inset:0;z-index:20;background:#5B1A3A;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.finale.open{display:flex}
.finale .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer;z-index:2}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}
.stage{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:16px}
.stage h2{font-size:clamp(28px,7vw,48px);font-weight:800;color:#FFC93C}
.stage p{margin:0;font-size:19px;color:#FFD6E2}
.stage input{font:inherit;font-size:24px;text-align:center;border:0;border-bottom:3px solid #FFC93C;background:transparent;color:#fff;width:min(340px,90%);padding:8px}
.stage .btn{flex:0 1 auto;min-width:200px}
.count{font-family:"Baloo 2",sans-serif;font-size:min(16vw,96px);font-weight:800;color:#FFC93C;line-height:1;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.beat svg{width:200px;height:auto;animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}60%{transform:scale(1)}}
.certwrap{width:100%;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px #FFC93C;animation:pop .6s ease-out}
.certwrap svg{display:block;width:100%;height:auto}
.stage .row{justify-content:center;padding:4px 0 0}
.msg{font-size:15px;color:#FFD6E2;min-height:20px}
footer{color:var(--soft);font-size:14px;text-align:center;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(.sheet){display:none!important}
  .sheet{position:static;display:block!important;background:none}
  .panel{max-height:none;border-radius:0}
  .close,.row{display:none!important}
}
.story{background:color-mix(in srgb,var(--sun) 18%,var(--card));border:2px solid var(--sun)}
.story p{font-size:18px}
header.hero .txt{position:static;padding:0 20px 20px;margin-top:-28px}
header.hero svg{height:150px;width:100%}
@media (min-width:600px){header.hero svg{height:190px}}
.namebox{display:none!important}
.certbtn[hidden]{display:none!important}
</style>
<link rel="icon" href="/favicon.svg">
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <div class="progress"><div class="bar"><i id="barFill"></i></div><b id="count"></b></div>
  <p class="hint" data-u="hint"></p>
  <div class="namebox"><label for="nome">Nome da cientista</label><input id="nome" placeholder="Escreva o nome" autocomplete="off"></div>
  <div class="grid" id="grid"></div>
  <button class="btn main certbtn" id="verCert" hidden data-u="seeCert"></button>
  <footer data-u="footer"></footer>

  <div class="finale" id="finale" role="dialog" aria-modal="true" aria-label="Missão cumprida">
    <button class="x" id="finaleX" aria-label="Fechar">×</button>
    <div class="stage" id="stage"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="panel" id="panel"></div>
  </div>
</div>

<script src="/content/corpo.js"></script>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get("lang");if(["pt","en","es"].includes(q))localStorage.setItem("pe-lang",q);const l=q||localStorage.getItem("pe-lang")||(navigator.language||"pt").slice(0,2).toLowerCase();return ["pt","en","es"].includes(l)?l:"pt"}catch(e){return "pt"}})();
const C=(window.CONTENT&&(window.CONTENT[LANG]||window.CONTENT.pt)),U=C.ui;
document.documentElement.lang=U.htmlLang;document.title=U.title;
document.querySelectorAll("[data-u]").forEach(el=>{el.textContent=U[el.dataset.u]});
document.getElementById("finale").setAttribute("aria-label",U.s1+" "+U.s2);document.getElementById("finaleX").setAttribute("aria-label",U.close);
/* ---------- Ilustrações em SVG ---------- */
const SK="#F6C7A8",SK2="#E2967A",HR="#5A3825",RD="#FF5A6E",PK="#FF9FB2",INK="#3A1730",BG="#5B1A3A";
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
function dots(seed,w,h,n){const r=rnd(seed);let s="";for(let i=0;i<n;i++){s+=`<circle cx="${(r()*w).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*6+2).toFixed(1)}" fill="#FF9FB2" opacity="${(r()*.16+.06).toFixed(2)}"/>`}return s}
function glow(cx,cy,r,c){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" opacity=".18"/>`}
function sparkle(x,y,r,c="#FFC93C"){return `<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="${c}"/>`}
function face(dx,dy,k,o={}){const e=o.closed?`<path d="M${dx-14*k} ${dy} q${5*k} ${5*k} ${10*k} 0 M${dx+4*k} ${dy} q${5*k} ${5*k} ${10*k} 0" stroke="${INK}" stroke-width="${3*k}" fill="none" stroke-linecap="round"/>`:`<circle cx="${dx-10*k}" cy="${dy}" r="${4*k}" fill="${INK}"/><circle cx="${dx+10*k}" cy="${dy}" r="${4*k}" fill="${INK}"/>`;return e+`<path d="M${dx-8*k} ${dy+12*k} q${8*k} ${8*k} ${16*k} 0" stroke="${INK}" stroke-width="${3*k}" fill="none" stroke-linecap="round"/>`}
function heart(cx,cy,s,c=RD,f=false){return `<g transform="translate(${cx} ${cy}) scale(${s})"><path d="M0 42 C-58 4 -56 -48 -14 -44 C-6 -43 0 -36 0 -30 C0 -36 6 -43 14 -44 C56 -48 58 4 0 42Z" fill="${c}"/><ellipse cx="-26" cy="-22" rx="10" ry="6" fill="#fff" opacity=".45" transform="rotate(-35 -26 -22)"/>${f?face(0,-8,1):""}</g>`}
function brain(cx,cy,s,f=false){const sq="#E0789A";return `<g transform="translate(${cx} ${cy}) scale(${s})"><path d="M-78 8 C-88 -42 -36 -74 0 -58 C36 -78 90 -46 80 6 C88 42 44 60 12 52 C-8 64 -66 58 -78 8Z" fill="#FFB3C6"/><path d="M0 -58 C-8 -24 8 14 2 52" stroke="${sq}" stroke-width="5" fill="none" stroke-linecap="round"/><g stroke="${sq}" stroke-width="4.5" fill="none" stroke-linecap="round"><path d="M-58 -26 q10 -14 22 -2 t20 -6"/><path d="M-66 8 q12 -10 24 2 t24 -4"/><path d="M-50 36 q10 -12 22 0"/><path d="M18 -34 q12 -12 24 0 t18 2"/><path d="M20 4 q12 10 24 -2 t22 4"/><path d="M26 34 q10 -10 22 2"/></g>${f?face(0,8,1.4):""}</g>`}
function lungs(cx,cy,s){const lobe=`M-10 -40 C-34 -52 -74 -14 -74 40 C-74 74 -44 82 -16 66 C-10 44 -10 0 -10 -40Z`;return `<g transform="translate(${cx} ${cy}) scale(${s})"><rect x="-7" y="-82" width="14" height="50" rx="6" fill="#FFD6E2"/><path d="M0 -36 L-22 -20 M0 -36 L22 -20" stroke="#FFD6E2" stroke-width="10" stroke-linecap="round"/><path d="${lobe}" fill="${PK}"/><path d="${lobe}" fill="${PK}" transform="scale(-1 1)"/><g stroke="#E0789A" stroke-width="4" fill="none" stroke-linecap="round"><path d="M-22 -20 L-40 6 M-40 6 L-56 22 M-40 6 L-36 40 M-30 -6 L-52 -10"/><path d="M22 -20 L40 6 M40 6 L56 22 M40 6 L36 40 M30 -6 L52 -10"/></g></g>`}
function bone(cx,cy,L,w,rot){const c="#FFF8F0";return `<g transform="translate(${cx} ${cy}) rotate(${rot})"><rect x="${-L/2}" y="${-w/2}" width="${L}" height="${w}" fill="${c}"/>${[-1,1].map(sx=>[-1,1].map(sy=>`<circle cx="${sx*L/2}" cy="${sy*w*.55}" r="${w*.72}" fill="${c}"/>`).join("")).join("")}</g>`}
function eye(cx,cy,r,iris="#3CC8A4",p=.42){return `<g transform="translate(${cx} ${cy})"><ellipse rx="${r*1.55}" ry="${r}" fill="#fff"/><circle r="${r*.78}" fill="${iris}"/><circle r="${r*.78*p}" fill="#1A0F15"/><circle cx="${-r*.25}" cy="${-r*.28}" r="${r*.16}" fill="#fff"/><ellipse rx="${r*1.55}" ry="${r}" fill="none" stroke="${INK}" stroke-width="${r*.06}"/></g>`}
function tooth(cx,cy,s,f=false){return `<g transform="translate(${cx} ${cy}) scale(${s})"><path d="M-30 -40 C-42 -40 -44 -10 -37 10 C-32 30 -28 52 -19 52 C-9 52 -8 25 0 25 C8 25 9 52 19 52 C28 52 32 30 37 10 C44 -10 42 -40 30 -40 C18 -40 10 -32 0 -32 C-10 -32 -18 -40 -30 -40Z" fill="#FFFDF8"/><ellipse cx="-20" cy="-22" rx="7" ry="4" fill="#fff" transform="rotate(-30 -20 -22)"/>${f?face(0,-4,1):""}</g>`}
function kid(x,y,s,o={}){const c=o.c||"#FF6F7F",a=`stroke="${SK}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  let arms=o.up?`<path d="M-18 -28 L-40 -30 L-44 -58" ${a}/><path d="M18 -28 L40 -30 L44 -58" ${a}/><ellipse cx="-32" cy="-34" rx="9" ry="7" fill="${SK}"/><ellipse cx="32" cy="-34" rx="9" ry="7" fill="${SK}"/>`:o.out?`<path d="M-18 -28 L-56 -34" ${a}/><path d="M18 -28 L56 -34" ${a}/>`:`<path d="M-18 -28 L-32 4" ${a}/><path d="M18 -28 L32 4" ${a}/>`;
  const legs=o.oneLeg?`<path d="M-9 12 L-9 42" ${a}/><path d="M9 12 L22 26 L10 34" ${a}/><ellipse cx="-11" cy="44" rx="9" ry="5" fill="${INK}"/>`:`<path d="M-9 12 L-9 42 M9 12 L9 42" ${a}/><ellipse cx="-11" cy="44" rx="9" ry="5" fill="${INK}"/><ellipse cx="11" cy="44" rx="9" ry="5" fill="${INK}"/>`;
  const mouth=o.o?`<ellipse cx="0" cy="-50" rx="5" ry="7" fill="#8A2340"/>`:`<path d="M-6 -53 q6 6 12 0" stroke="${INK}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  const eyes=o.closed?`<path d="M-11 -63 q4 3 8 0 M3 -63 q4 3 8 0" stroke="${INK}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`:`<circle cx="-7" cy="-63" r="2.8" fill="${INK}"/><circle cx="7" cy="-63" r="2.8" fill="${INK}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s}) rotate(${o.rot||0})"><path d="M-25 -66 C-30 -100 30 -100 25 -66 L29 -26 L-29 -26Z" fill="${HR}"/>${arms}${legs}<rect x="-6" y="-42" width="12" height="10" fill="${SK}"/><path d="M-19 -34 L19 -34 L27 14 L-27 14Z" fill="${c}"/><circle cy="-60" r="22" fill="${SK}"/><path d="M-22 -62 C-22 -88 22 -88 22 -62 C12 -74 -4 -76 -22 -62Z" fill="${HR}"/><circle cx="-13" cy="-54" r="4" fill="#FF8FA3" opacity=".6"/><circle cx="13" cy="-54" r="4" fill="#FF8FA3" opacity=".6"/>${eyes}${mouth}</g>`}
function bigFace(cx,cy,r,o={}){const k=r/100;let eyes=o.closed?`<path d="M-48 -8 q13 12 26 0 M22 -8 q13 12 26 0" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`:`<circle cx="-35" cy="-6" r="10" fill="${INK}"/><circle cx="35" cy="-6" r="10" fill="${INK}"/><circle cx="-38" cy="-9" r="3" fill="#fff"/><circle cx="32" cy="-9" r="3" fill="#fff"/>`;
  const m={smile:`<path d="M-26 44 q26 24 52 0" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>`,o:`<ellipse cx="0" cy="52" rx="18" ry="22" fill="#8A2340"/>`,big:`<ellipse cx="0" cy="50" rx="28" ry="34" fill="#8A2340"/><ellipse cx="0" cy="68" rx="16" ry="10" fill="#FF8FA3"/>`}[o.mouth||"smile"];
  const back=o.long?`<path d="M-104 -10 C-110 -140 110 -140 104 -10 L116 150 L-116 150Z" fill="${HR}"/>`:`<path d="M-104 -10 C-110 -140 110 -140 104 -10 L106 80 L-106 80Z" fill="${HR}"/>`;
  return `<g transform="translate(${cx} ${cy}) scale(${k})">${back}<circle r="100" fill="${SK}"/><path d="M-100 -14 C-100 -124 100 -124 100 -14 C70 -74 -20 -84 -100 -14Z" fill="${HR}"/><circle cx="-56" cy="30" r="13" fill="#FF8FA3" opacity=".55"/><circle cx="56" cy="30" r="13" fill="#FF8FA3" opacity=".55"/>${eyes}<path d="M-7 14 q7 12 14 0" stroke="${SK2}" stroke-width="5" fill="none" stroke-linecap="round"/>${m}</g>`}
function rbc(cx,cy,r){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${RD}"/><circle cx="${cx}" cy="${cy}" r="${r*.5}" fill="#D93A50"/>`}
function cell(cx,cy,r,c){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" opacity=".9"/><circle cx="${cx+r*.12}" cy="${cy-r*.08}" r="${r*.34}" fill="${BG}" opacity=".55"/><circle cx="${cx-r*.45}" cy="${cy+r*.35}" r="${r*.09}" fill="#fff" opacity=".7"/><circle cx="${cx+r*.4}" cy="${cy+r*.4}" r="${r*.07}" fill="#fff" opacity=".7"/>`}
function germ(cx,cy,r){let s="";for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<circle cx="${cx+Math.cos(a)*r*1.15}" cy="${cy+Math.sin(a)*r*1.15}" r="${r*.22}" fill="#7BD66E"/>`}return s+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#7BD66E"/><path d="M${cx-r*.5} ${cy-r*.35} l${r*.3} ${r*.15} M${cx+r*.5} ${cy-r*.35} l${-r*.3} ${r*.15}" stroke="${INK}" stroke-width="${r*.12}" stroke-linecap="round"/><circle cx="${cx-r*.28}" cy="${cy}" r="${r*.1}" fill="${INK}"/><circle cx="${cx+r*.28}" cy="${cy}" r="${r*.1}" fill="${INK}"/><path d="M${cx-r*.25} ${cy+r*.42} q${r*.25} ${-r*.18} ${r*.5} 0" stroke="${INK}" stroke-width="${r*.1}" fill="none" stroke-linecap="round"/>`}
function magnifier(cx,cy,r){return `<line x1="${cx+r*.7}" y1="${cy+r*.7}" x2="${cx+r*1.5}" y2="${cy+r*1.5}" stroke="#C98A4B" stroke-width="${r*.28}" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" opacity=".18" stroke="#FFC93C" stroke-width="${r*.14}"/>`}
function drop(cx,cy,s,c="#8FD3FF"){return `<path transform="translate(${cx} ${cy}) scale(${s})" d="M0 -40 C18 -12 30 4 30 18 A30 30 0 0 1 -30 18 C-30 4 -18 -12 0 -40Z" fill="${c}"/>`}
function snow(x,y,r){return `<g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9">${[0,60,120].map(a=>`<line x1="${x}" y1="${y-r}" x2="${x}" y2="${y+r}" transform="rotate(${a} ${x} ${y})"/>`).join("")}</g>`}
function sunS(cx,cy,r){let s="";for(let i=0;i<10;i++){const a=i*Math.PI/5;s+=`<line x1="${cx+Math.cos(a)*r*1.25}" y1="${cy+Math.sin(a)*r*1.25}" x2="${cx+Math.cos(a)*r*1.6}" y2="${cy+Math.sin(a)*r*1.6}" stroke="#FFC93C" stroke-width="${r*.16}" stroke-linecap="round"/>`}return s+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFC93C"/>`}

function render(){
  const next=[...Array(30).keys()].find(i=>!done.includes(i));
  grid.innerHTML=D.map((d,i)=>`<button class="day${done.includes(i)?" done":""}${i===next?" next":""}" data-i="${i}" aria-label="${U.day} ${i+1}: ${d.t}${done.includes(i)?U.doneA:""}"><span class="n">${i+1}</span><span class="e">${d.e}</span></button>`).join("");
  document.getElementById("barFill").style.width=(done.length/30*100)+"%";
  document.getElementById("count").textContent=done.length+" "+U.of+" 30";
  document.getElementById("verCert").hidden=done.length!==30;
}
function open(i){
  const d=D[i],isDone=done.includes(i);
  panel.innerHTML=`<div class="art">${scene(d.a,i*17+5)}<span class="badge">${U.day} ${i+1}</span><button class="close" aria-label="${U.close}">×</button></div>
  <div class="body"><h2>${d.e} ${d.t}</h2>${d.h?`<div class="box story"><h3>📖 ${U.story}</h3><p style="margin:0">${d.h}</p></div>`:""}<p class="fact">${d.f}</p><p class="extra">${U.know} ${d.x}</p>
  <h3 class="more-t">${U.more}</h3><ul class="more">${d.s.map(t=>`<li>${t}</li>`).join("")}</ul>
  <div class="box exp"><h3>🔬 ${U.exp}: ${d.ex.t}</h3><p class="mat">${U.need}: ${d.ex.m}</p><ol>${d.ex.p.map(t=>`<li>${t}</li>`).join("")}</ol></div>
  <div class="box act"><h3>✂️ ${U.act}: ${d.at}</h3><p class="mat">${U.need}: ${d.m}</p><ol>${d.p.map(t=>`<li>${t}</li>`).join("")}</ol></div>
  <div class="box ask"><h3>💬 ${U.ask}</h3><p style="margin:0">${d.q}</p></div></div>
  <div class="row"><button class="btn main" id="mark">${isDone?U.unmark:U.markDone+" ❤️"}</button></div>`;
  sheet.classList.add("open");panel.scrollTop=0;
  panel.querySelector(".close").onclick=close;
  panel.querySelector("#mark").onclick=()=>{done=isDone?done.filter(x=>x!==i):[...done,i];save();render();close();if(!isDone&&done.length===30)showFinale()};
  panel.querySelector(".close").focus();
}
function close(){sheet.classList.remove("open")}
grid.addEventListener("click",e=>{const b=e.target.closest(".day");if(b)open(+b.dataset.i)});
sheet.addEventListener("click",e=>{if(e.target===sheet)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){close();closeFinale()}});

  fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=["#FFC93C","#FF6F7F","#3CC8A4","#8C7BFF","#8FD3FF","#fff"];
  const ps=[...Array(170)].map(()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,v:2+Math.random()*3.5,w:(Math.random()-.5)*1.6,r:5+Math.random()*7,a:Math.random()*6,s:(Math.random()-.5)*.2,c:cols[Math.random()*cols.length|0],h:Math.random()<.4}));
  const id=++fxRun,t0=performance.now();
  (function f(t){if(id!==fxRun)return;ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.y+=p.v;p.x+=p.w+Math.sin((t+p.a*300)/400)*.6;p.a+=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      if(p.h){const k=p.r/40;ctx.beginPath();ctx.moveTo(0,40*k);ctx.bezierCurveTo(-58*k,4*k,-56*k,-48*k,0,-30*k);ctx.bezierCurveTo(56*k,-48*k,58*k,4*k,0,40*k);ctx.fill()}else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(t-t0<6500)requestAnimationFrame(f);else ctx.clearRect(0,0,innerWidth,innerHeight)})(t0);
}
function showFinale(){
  timers.forEach(clearTimeout);timers=[];finale.classList.add("open");document.body.style.overflow="hidden";
  if(!nome.value.trim())askName();else beat();
}
function closeFinale(){if(!finale.classList.contains("open"))return;timers.forEach(clearTimeout);timers=[];fxRun++;fx.getContext("2d").clearRect(0,0,fx.width,fx.height);finale.classList.remove("open");document.body.style.overflow=""}
document.getElementById("finaleX").onclick=closeFinale;
document.getElementById("verCert").onclick=()=>{showFinale()};
function askName(){
  stage.innerHTML=`<h2>${U.congrats} 🎉</h2><p>${U.askName}</p><input id="fn" placeholder="${U.namePh}" autocomplete="off" aria-label="${U.namePh}"><div class="row"><button class="btn main" id="fnGo">${U.seeCert}</button></div>`;
  const fn=stage.querySelector("#fn"),go=()=>{if(!fn.value.trim()){fn.focus();return}nome.value=fn.value.trim();try{localStorage.setItem(NKEY,nome.value)}catch(e){}save();beat()};
  stage.querySelector("#fnGo").onclick=go;fn.onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>fn.focus(),50);
}
function beat(){
  if(calm){showCert();return}
  stage.innerHTML=`<p>${U.listen}</p><div class="beat"><svg viewBox="-70 -60 140 110">${heart(0,0,1,RD,true)}</svg></div><div class="count" id="tt"></div>`;
  U.beats.forEach((w,k)=>later(()=>{const el=stage.querySelector("#tt");if(el){el.textContent=w;el.style.animation="none";void el.offsetWidth;el.style.animation=""}},300+k*900));
  later(showCert,3300);
}
function showCert(){
  const nm=nome.value.trim(),date=new Date().toLocaleDateString(U.locale);
  stage.innerHTML=`<h2>${U.cheer}, ${esc(nm||U.who)}!</h2><div class="certwrap" id="certArt">${certSVG(nm,date)}</div><div class="row"><button class="btn main" id="dl" hidden>${U.download}</button><button class="btn sec" id="fin">${U.back}</button></div><div class="msg" id="msg"></div>`;
  stage.querySelector("#fin").onclick=closeFinale;
  confetti();
  (async()=>{try{const dl={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};const b=stage.querySelector("#dl");if(!b)return;b.hidden=false;
    b.onclick=async()=>{const m=stage.querySelector("#msg");m.textContent=U.preparing;
      try{const blob=await toPNG(certSVG(nm,date));await dl.save({filename:U.file,data:blob});m.textContent=U.saved}
      catch(e){m.textContent=e&&e.code==="declined"?"":U.dlFail}}}catch(e){}})();
}
function toPNG(svg){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=2112;c.height=1632;const x=c.getContext("2d");x.drawImage(img,0,0,2112,1632);c.toBlob(b=>b?res(b):rej(new Error("png")),"image/png")}catch(e){rej(e)}};img.onerror=rej;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace("<svg ",'<svg width="1056" height="816" '))})}
render();
</script>
