<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 dias no espaço</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEFF; --ink:#1E2156; --soft:#4A4E8A; --card:#FFFFFF; --line:#C9D2F5;
  --sky:#1B1E4B; --sun:#FFC93C; --coral:#FF6F7F; --mint:#3CC8A4; --lav:#8C7BFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10122F;--ink:#F1F2FF;--soft:#B6B9E6;--card:#1C1F4A;--line:#33377A}
}
:root[data-theme="dark"]{--bg:#10122F;--ink:#F1F2FF;--soft:#B6B9E6;--card:#1C1F4A;--line:#33377A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,.baloo{font-family:"Baloo 2","Nunito",system-ui,sans-serif;line-height:1.1;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header.hero{background:var(--sky);color:#fff;border-radius:28px;overflow:hidden;position:relative}
header.hero svg{display:block;width:100%;height:auto}
header.hero .txt{position:absolute;left:20px;bottom:18px;right:20px}
header.hero h1{font-size:clamp(34px,9vw,56px);font-weight:800;letter-spacing:-.5px}
header.hero p{margin:4px 0 0;color:#D8DBFF;font-size:16px;max-width:30ch}
.progress{display:flex;align-items:center;gap:12px;margin:20px 4px 10px}
.bar{flex:1;height:14px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);width:0;transition:width .4s}
.progress b{font-family:"Baloo 2",sans-serif;font-size:18px;white-space:nowrap}
.hint{color:var(--soft);font-size:15px;margin:0 4px 16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(6,1fr)}}
.day{appearance:none;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:"Baloo 2",sans-serif;padding:0;position:relative}
.day .n{font-size:24px;font-weight:800;line-height:1}
.day .e{font-size:14px;line-height:1}
.day.done{background:var(--sky);border-color:var(--sun);color:var(--sun)}
.day.done::after{content:"★";position:absolute;top:-6px;right:-4px;font-size:18px;color:var(--sun)}
.day.next{border-color:var(--coral);box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 25%,transparent)}
.day:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,12,40,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--card);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:28px}}
.art{background:var(--sky);position:relative}
.art svg{display:block;width:100%;height:auto}
.art .badge{position:absolute;top:14px;left:14px;background:var(--sun);color:var(--sky);font-family:"Baloo 2",sans-serif;font-weight:800;border-radius:20px;padding:2px 14px;font-size:17px}
.close{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;cursor:pointer}
.body{padding:18px 20px 4px}
.body h2{font-size:30px;font-weight:800;margin-bottom:8px}
.fact{font-size:19px;margin:0 0 10px}
.extra{color:var(--soft);margin:0 0 18px}
.box{border-radius:20px;padding:14px 16px;margin-bottom:14px}
.box h3{font-size:21px;margin-bottom:6px}
.act{background:color-mix(in srgb,var(--mint) 16%,var(--card));border:2px solid var(--mint)}
.exp{background:color-mix(in srgb,var(--coral) 13%,var(--card));border:2px solid var(--coral)}
.more{margin:0 0 18px;padding-left:0;list-style:none}
.more li{position:relative;padding-left:26px;margin-bottom:8px}
.more li::before{content:"★";position:absolute;left:2px;color:var(--sun);font-size:18px;line-height:1.3}
.more-t{font-size:21px;margin:0 0 8px}
.ask{background:color-mix(in srgb,var(--lav) 14%,var(--card));border:2px dashed var(--lav)}
.mat{font-size:15px;color:var(--soft);margin:0 0 6px}
ol{margin:0;padding-left:22px}
ol li{margin-bottom:4px}
.row{display:flex;gap:10px;padding:6px 20px 0;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:0;border-radius:18px;padding:14px;font-family:"Baloo 2",sans-serif;font-size:19px;font-weight:700;cursor:pointer}
.btn.main{background:var(--sun);color:var(--sky)}
.btn.sec{background:var(--line);color:var(--ink)}
.cert{margin-top:26px;background:var(--card);border:3px solid var(--sun);border-radius:28px;padding:22px;text-align:center;display:none}
.cert.show{display:block}
.cert h2{font-size:30px}
.cert input{font:inherit;font-size:20px;text-align:center;border:0;border-bottom:3px solid var(--sun);background:transparent;color:var(--ink);width:min(320px,90%);padding:6px;margin:12px 0}
.cert .big{font-family:"Baloo 2",sans-serif;font-size:26px;font-weight:800;min-height:34px}
.namebox{display:flex;align-items:center;gap:10px;margin:0 4px 16px;flex-wrap:wrap}
.namebox label{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:18px}
.namebox input{flex:1;min-width:160px;font:inherit;font-size:18px;border:0;border-bottom:3px solid var(--sun);background:transparent;color:var(--ink);padding:6px 4px}
.certbtn{display:block;width:100%;margin-top:22px}
.finale{position:fixed;inset:0;z-index:20;background:#1B1E4B;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.finale.open{display:flex}
.finale .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px;cursor:pointer;z-index:2}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}
.stage{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:16px}
.stage h2{font-size:clamp(28px,7vw,48px);font-weight:800;color:#FFC93C}
.stage p{margin:0;font-size:19px;color:#D8DBFF}
.stage input{font:inherit;font-size:24px;text-align:center;border:0;border-bottom:3px solid #FFC93C;background:transparent;color:#fff;width:min(340px,90%);padding:8px}
.stage .btn{flex:0 1 auto;min-width:200px}
.count{font-family:"Baloo 2",sans-serif;font-size:min(40vw,220px);font-weight:800;color:#FFC93C;line-height:1;animation:pop .7s ease-out}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.launch svg{width:180px;height:auto;animation:lift 1.6s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes lift{0%{transform:translateY(0)}15%{transform:translate(-3px,2px)}25%{transform:translate(3px,-2px)}100%{transform:translateY(-120vh)}}
.certwrap{width:100%;border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px #FFC93C;animation:pop .6s ease-out}
.certwrap svg{display:block;width:100%;height:auto}
.stage .row{justify-content:center;padding:4px 0 0}
.msg{font-size:15px;color:#D8DBFF;min-height:20px}
footer{color:var(--soft);font-size:14px;text-align:center;margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(.sheet){display:none!important}
  .sheet{position:static;display:block!important;background:none}
  .panel{max-height:none;border-radius:0}
  .close,.row{display:none!important}
}
.story{background:color-mix(in srgb,var(--sun) 18%,var(--card));border:2px solid var(--sun)}
.story p{font-size:18px}
.namebox{display:none!important}
.certbtn[hidden]{display:none!important}
</style>
<link rel="icon" href="/favicon.svg">
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <div class="progress"><div class="bar"><i id="barFill"></i></div><b id="count"></b></div>
  <p class="hint" data-u="hint"></p>
  <div class="namebox"><label for="nome">Nome da astronauta</label><input id="nome" placeholder="Escreva o nome" autocomplete="off"></div>
  <div class="grid" id="grid"></div>
  <button class="btn main certbtn" id="verCert" hidden data-u="seeCert"></button>
  <footer data-u="footer"></footer>

  <div class="finale" id="finale" role="dialog" aria-modal="true" aria-label="Missão cumprida">
    <button class="x" id="finaleX" aria-label="Fechar">×</button>
    <div class="stage" id="stage"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="panel" id="panel"></div>
  </div>
</div>

<script src="/content/espaco.js"></script>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get("lang");if(["pt","en","es"].includes(q))localStorage.setItem("pe-lang",q);const l=q||localStorage.getItem("pe-lang")||(navigator.language||"pt").slice(0,2).toLowerCase();return ["pt","en","es"].includes(l)?l:"pt"}catch(e){return "pt"}})();
const C=(window.CONTENT&&(window.CONTENT[LANG]||window.CONTENT.pt)),U=C.ui;
document.documentElement.lang=U.htmlLang;document.title=U.title;
document.querySelectorAll("[data-u]").forEach(el=>{el.textContent=U[el.dataset.u]});
document.getElementById("finale").setAttribute("aria-label",U.s1+" "+U.s2);document.getElementById("finaleX").setAttribute("aria-label",U.close);
/* ---------- Ilustrações em SVG ---------- */
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
function stars(seed,w,h,n){const r=rnd(seed);let s="";for(let i=0;i<n;i++){const x=(r()*w).toFixed(1),y=(r()*h).toFixed(1),rad=(r()*1.6+.4).toFixed(1),o=(r()*.6+.4).toFixed(2);s+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#fff" opacity="${o}"/>`}return s}
function planet(cx,cy,r,c1,c2,opt={}){
  const id="p"+Math.round(cx+cy+r);
  let s=`<defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>`;
  if(opt.ringBack) s+=`<ellipse cx="${cx}" cy="${cy}" rx="${r*1.9}" ry="${r*.45}" fill="none" stroke="${opt.ringBack}" stroke-width="${r*.18}" opacity=".9" transform="rotate(${opt.tilt||-12} ${cx} ${cy})"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c1}"/>`;
  s+=`<g clip-path="url(#${id})">`;
  if(opt.stripes){for(let i=-3;i<=3;i++){s+=`<rect x="${cx-r}" y="${cy+i*r*.28-r*.06}" width="${r*2}" height="${r*.12}" fill="${c2}" opacity=".7"/>`}}
  if(opt.spot) s+=`<ellipse cx="${cx+r*.3}" cy="${cy+r*.35}" rx="${r*.28}" ry="${r*.15}" fill="${opt.spot}"/>`;
  if(opt.land){s+=`<path d="M${cx-r*.7} ${cy-r*.3} q${r*.3} ${-r*.5} ${r*.7} ${-r*.2} q${r*.2} ${r*.4} ${-r*.1} ${r*.6} q${-r*.4} ${r*.1} ${-r*.6} ${-r*.4}z" fill="${c2}"/><path d="M${cx+r*.1} ${cy+r*.2} q${r*.4} ${-r*.2} ${r*.6} ${r*.2} q${-r*.1} ${r*.4} ${-r*.5} ${r*.4}z" fill="${c2}"/>`}
  if(opt.craters){[[-.35,-.3,.18],[.3,.1,.24],[-.1,.45,.12],[.4,-.45,.1]].forEach(c=>s+=`<circle cx="${cx+c[0]*r}" cy="${cy+c[1]*r}" r="${c[2]*r}" fill="${c2}"/>`)}
  s+=`<circle cx="${cx+r*.35}" cy="${cy+r*.35}" r="${r*1.05}" fill="#000" opacity=".22" transform="translate(${r*.35} ${r*.35})"/>`;
  s+=`</g>`;
  if(opt.ring) s+=`<path d="M${cx-r*1.9} ${cy} A${r*1.9} ${r*.45} 0 0 0 ${cx+r*1.9} ${cy}" fill="none" stroke="${opt.ring}" stroke-width="${r*.18}" transform="rotate(${opt.tilt||-12} ${cx} ${cy})"/>`;
  if(opt.face) s+=`<circle cx="${cx-r*.3}" cy="${cy-r*.1}" r="${r*.08}" fill="#1B1E4B"/><circle cx="${cx+r*.25}" cy="${cy-r*.1}" r="${r*.08}" fill="#1B1E4B"/><path d="M${cx-r*.2} ${cy+r*.2} q${r*.2} ${r*.2} ${r*.4} 0" stroke="#1B1E4B" stroke-width="${r*.06}" fill="none" stroke-linecap="round"/>`;
  return s;
}
function sun(cx,cy,r){let s="";for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=`<line x1="${cx+Math.cos(a)*r*1.15}" y1="${cy+Math.sin(a)*r*1.15}" x2="${cx+Math.cos(a)*r*1.5}" y2="${cy+Math.sin(a)*r*1.5}" stroke="#FFC93C" stroke-width="${r*.12}" stroke-linecap="round"/>`}return s+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFB020"/><circle cx="${cx}" cy="${cy}" r="${r*.8}" fill="#FFC93C"/>`}
function rocket(x,y,s,flame=true){return `<g transform="translate(${x} ${y}) scale(${s})">${flame?`<path d="M-12 40 Q0 80 12 40z" fill="#FF6F7F"/><path d="M-6 40 Q0 64 6 40z" fill="#FFC93C"/>`:""}<path d="M-26 30 L-14 10 L-14 38z" fill="#FF6F7F"/><path d="M26 30 L14 10 L14 38z" fill="#FF6F7F"/><path d="M0 -50 C22 -30 20 10 16 40 L-16 40 C-20 10 -22 -30 0 -50z" fill="#F1F2FF"/><path d="M0 -50 C10 -42 14 -34 15 -26 L-15 -26 C-14 -34 -10 -42 0 -50z" fill="#FF6F7F"/><circle cx="0" cy="-4" r="9" fill="#8C7BFF" stroke="#4A4E8A" stroke-width="3"/></g>`}
function astronaut(x,y,s,rot=0){return `<g transform="translate(${x} ${y}) scale(${s}) rotate(${rot})"><rect x="-22" y="-4" width="44" height="30" rx="8" fill="#C9D2F5"/><rect x="-18" y="0" width="36" height="42" rx="14" fill="#F1F2FF"/><rect x="-32" y="4" width="16" height="12" rx="6" fill="#F1F2FF" transform="rotate(-30 -24 10)"/><rect x="16" y="4" width="16" height="12" rx="6" fill="#F1F2FF" transform="rotate(30 24 10)"/><rect x="-16" y="36" width="12" height="20" rx="5" fill="#F1F2FF"/><rect x="4" y="36" width="12" height="20" rx="5" fill="#F1F2FF"/><circle cx="0" cy="-20" r="22" fill="#F1F2FF"/><ellipse cx="0" cy="-20" rx="15" ry="12" fill="#1B1E4B"/><ellipse cx="-5" cy="-24" rx="5" ry="3" fill="#8C7BFF" opacity=".8"/><rect x="-7" y="10" width="14" height="10" rx="3" fill="#FF6F7F"/></g>`}
function comet(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 L-150 -40 L-150 40z" fill="#8FE3FF" opacity=".25"/><path d="M0 0 L-110 -18 L-110 18z" fill="#fff" opacity=".45"/><circle r="16" fill="#E6F7FF"/><circle r="9" fill="#fff"/></g>`}
function galaxy(cx,cy,r){let s="";const rn=rnd(7);for(let i=0;i<260;i++){const t=i/260*4*Math.PI,arm=i%2?Math.PI:0,d=t/(4*Math.PI)*r;const x=cx+Math.cos(t+arm)*d+(rn()-.5)*14,y=cy+Math.sin(t+arm)*d*.55+(rn()-.5)*8;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rn()*1.8+.6).toFixed(1)}" fill="${i%5?"#fff":"#C9B8FF"}" opacity="${(rn()*.6+.4).toFixed(2)}"/>`}return `<ellipse cx="${cx}" cy="${cy}" rx="${r*1.1}" ry="${r*.6}" fill="#8C7BFF" opacity=".25"/>`+s+`<circle cx="${cx}" cy="${cy}" r="${r*.14}" fill="#FFE6A8"/>`}
function blackhole(cx,cy,r){return `<ellipse cx="${cx}" cy="${cy}" rx="${r*2.2}" ry="${r*.55}" fill="none" stroke="#FFB020" stroke-width="${r*.35}" opacity=".9"/><ellipse cx="${cx}" cy="${cy}" rx="${r*1.7}" ry="${r*.4}" fill="none" stroke="#FF6F7F" stroke-width="${r*.15}"/><circle cx="${cx}" cy="${cy}" r="${r*1.1}" fill="none" stroke="#FFC93C" stroke-width="3" opacity=".7"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#000"/><path d="M${cx-r*2.2} ${cy} A${r*2.2} ${r*.55} 0 0 0 ${cx+r*2.2} ${cy}" fill="none" stroke="#FFB020" stroke-width="${r*.35}"/>`}
function iss(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-70" y="-3" width="140" height="6" fill="#C9D2F5"/>${[-60,-38,26,48].map(px=>`<rect x="${px}" y="-34" width="18" height="28" fill="#5A7BFF" stroke="#C9D2F5" stroke-width="2"/><rect x="${px}" y="6" width="18" height="28" fill="#5A7BFF" stroke="#C9D2F5" stroke-width="2"/>`).join("")}<rect x="-16" y="-10" width="32" height="20" rx="6" fill="#F1F2FF"/><rect x="-6" y="-16" width="12" height="32" rx="4" fill="#E0E4F8"/></g>`}
function constellation(pts,lines,color="#FFC93C"){let s="";lines.forEach(([a,b])=>s+=`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="${color}" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/>`);pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#fff"/><circle cx="${p[0]}" cy="${p[1]}" r="12" fill="#fff" opacity=".15"/>`);return s}
function moonPhase(cx,cy,r,k){/* k: -1 nova ... 1 cheia */const w=Math.abs(k)*r;return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#3A3E75"/><path d="M${cx} ${cy-r} A${r} ${r} 0 0 1 ${cx} ${cy+r} A${w} ${r} 0 0 ${k>0?1:0} ${cx} ${cy-r}z" fill="#E8E6D8"/>`}
function foot(x,y,rot){return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="-14" y="-30" width="28" height="60" rx="13" fill="#8E90A8"/>${[-20,-8,4,16].map(yy=>`<rect x="-12" y="${yy}" width="24" height="5" rx="2" fill="#6E7090"/>`).join("")}</g>`}
function glow(cx,cy,r,c){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" opacity=".18"/>`}

const W=600,H=340;
function scene(key,seed){
  let g=stars(seed,W,H,70);
  const A={
    sun:()=>sun(300,175,90)+planet(520,280,22,"#3C8DFF","#3CC8A4",{land:1}),
    dayNight:()=>sun(90,170,55)+`<line x1="160" y1="170" x2="330" y2="170" stroke="#FFC93C" stroke-width="4" stroke-dasharray="6 8"/>`+planet(420,170,95,"#3C8DFF","#3CC8A4",{land:1})+`<path d="M420 75 A95 95 0 0 1 420 265 A40 95 0 0 0 420 75" fill="#000" opacity=".35"/>`,
    moon:()=>glow(300,170,140,"#FFF6D6")+planet(300,170,110,"#E8E6D8","#C9C6B4",{craters:1}),
    phases:()=>[-.85,-.4,.4,1].map((k,i)=>moonPhase(110+i*127,170,48,k)).join(""),
    feet:()=>`<rect x="0" y="210" width="600" height="130" fill="#B8B6A8"/><ellipse cx="300" cy="210" rx="330" ry="30" fill="#B8B6A8"/>`+foot(200,275,-10)+foot(270,250,-10)+foot(360,280,-6)+foot(430,255,-6)+planet(500,80,34,"#3C8DFF","#3CC8A4",{land:1}),
    mercury:()=>sun(-10,170,130)+planet(380,170,55,"#A9A3A0","#8C8583",{craters:1}),
    venus:()=>glow(300,170,150,"#FFB020")+planet(300,170,110,"#F2C46B","#E5A54B",{stripes:1}),
    mars:()=>planet(300,170,110,"#E0603F","#B8452B",{craters:1})+`<ellipse cx="300" cy="68" rx="30" ry="10" fill="#fff" opacity=".85"/>`,
    jupiterSize:()=>planet(250,175,135,"#E8B98A","#C77F4E",{stripes:1,spot:"#C4553A"})+planet(500,175,12,"#3C8DFF","#3CC8A4",{land:1})+`<text x="500" y="215" fill="#fff" font-family="Baloo 2" font-size="20" text-anchor="middle">${U.lab.earth}</text>`,
    storm:()=>{let s=planet(300,170,120,"#E8B98A","#C77F4E",{stripes:1});for(let i=0;i<4;i++)s+=`<ellipse cx="330" cy="215" rx="${60-i*13}" ry="${30-i*6}" fill="none" stroke="${i%2?"#FFE0C4":"#C4553A"}" stroke-width="7"/>`;return s},
    saturnFloat:()=>`<rect x="0" y="230" width="600" height="110" fill="#3C8DFF" opacity=".55"/><path d="M0 230 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0" fill="#3C8DFF" opacity=".75"/>`+planet(300,200,70,"#E8CF8A","#C9A45A",{stripes:1,ring:"#F5E6B8",ringBack:"#F5E6B8"})+`<text x="300" y="60" fill="#FFC93C" font-family="Baloo 2" font-size="30" font-weight="800" text-anchor="middle">${U.lab.plim}</text>`,
    saturn:()=>planet(300,170,85,"#E8CF8A","#C9A45A",{stripes:1,ring:"#F5E6B8",ringBack:"#F5E6B8",tilt:-15}),
    uranus:()=>planet(300,170,95,"#8FE3E8","#6CC9D1",{ring:"#C9F4F7",ringBack:"#C9F4F7",tilt:-80})+`<path d="M470 110 a40 40 0 1 1 -10 -30" stroke="#FFC93C" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M468 70 l-6 12 l14 -2z" fill="#FFC93C"/>`,
    neptune:()=>planet(310,170,105,"#3D5BFF","#2A40C9",{stripes:1})+[0,1,2].map(i=>`<path d="M40 ${120+i*50} q60 -25 120 0 t120 0" stroke="#C9D2F5" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>`).join(""),
    pluto:()=>planet(300,175,70,"#D9B99B","#B48E6E",{craters:1,face:1})+`<path d="M300 205 m-22 -18 q22 -34 44 0 q-22 30 -44 0" fill="#F5E6D8" opacity=".85"/>`+planet(470,90,22,"#9A928A","#7C746C",{}),
    venusSlow:()=>planet(300,170,95,"#F2C46B","#E5A54B",{stripes:1})+`<path d="M160 60 A170 130 0 0 1 460 60" stroke="#FFC93C" stroke-width="5" fill="none" stroke-dasharray="3 12" stroke-linecap="round"/><text x="300" y="320" fill="#fff" font-family="Baloo 2" font-size="24" text-anchor="middle">${U.lab.slow}</text>`,
    starColors:()=>[["#8FB8FF",110,130,34],["#FFFFFF",250,210,26],["#FFE68A",360,120,30],["#FFB070",480,200,24],["#FF6F5F",540,100,18]].map(([c,x,y,r])=>glow(x,y,r*2.4,c)+`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join(""),
    constellation:()=>constellation([[120,90],[210,130],[300,110],[390,160],[470,120],[420,250],[330,230]],[[0,1],[1,2],[2,3],[3,4],[3,5],[5,6],[6,3]]),
    comet:()=>sun(40,300,40)+comet(430,110,1.4),
    meteor:()=>[[500,40],[380,90],[560,150]].map(([x,y],i)=>`<line x1="${x}" y1="${y}" x2="${x-140}" y2="${y+70}" stroke="#fff" stroke-width="${4-i}" stroke-linecap="round" opacity=".85"/><circle cx="${x-140}" cy="${y+70}" r="${5-i}" fill="#FFE68A"/>`).join("")+`<path d="M0 300 q150 -40 300 -10 t300 -20 v70 h-600z" fill="#0B0D2A"/>`,
    galaxy:()=>galaxy(300,170,170),
    light:()=>sun(80,170,60)+`<line x1="160" y1="170" x2="470" y2="170" stroke="#FFC93C" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/><path d="M455 155 l20 15 l-20 15z" fill="#FFC93C"/>`+planet(525,170,40,"#3C8DFF","#3CC8A4",{land:1})+`<text x="315" y="140" fill="#fff" font-family="Baloo 2" font-size="30" font-weight="800" text-anchor="middle">8 min</text>`,
    quiet:()=>astronaut(300,170,2.1,-8)+`<text x="440" y="90" fill="#fff" font-family="Baloo 2" font-size="34" text-anchor="middle" opacity=".7">${U.lab.shh}</text>`,
    float:()=>astronaut(220,170,1.7,-25)+astronaut(420,150,1.3,20)+planet(560,300,60,"#3C8DFF","#3CC8A4",{land:1}),
    sleep:()=>`<g transform="translate(300 175) rotate(-6)"><rect x="-55" y="-110" width="110" height="220" rx="50" fill="#8C7BFF"/><rect x="-55" y="-10" width="110" height="120" rx="40" fill="#6E5CF0"/><circle cx="0" cy="-65" r="34" fill="#F6D2B8"/><path d="M-14 -66 q6 5 12 0 M4 -66 q6 5 12 0" stroke="#1B1E4B" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="420" y="90" fill="#fff" font-family="Baloo 2" font-size="32">z</text><text x="450" y="60" fill="#fff" font-family="Baloo 2" font-size="42">Z</text>`,
    iss:()=>planet(300,440,260,"#3C8DFF","#3CC8A4",{land:1})+iss(300,110,1.6),
    moonLanding:()=>`<rect x="0" y="240" width="600" height="100" fill="#B8B6A8"/><ellipse cx="300" cy="240" rx="330" ry="26" fill="#B8B6A8"/>`+astronaut(230,200,1.2,0)+`<line x1="340" y1="250" x2="340" y2="120" stroke="#E0E4F8" stroke-width="4"/><rect x="340" y="122" width="70" height="44" fill="#fff"/><rect x="340" y="122" width="70" height="44" fill="none" stroke="#FF6F7F" stroke-width="4"/>`+planet(510,70,32,"#3C8DFF","#3CC8A4",{land:1}),
    rocket:()=>rocket(300,160,2.2)+[0,1,2].map(i=>`<circle cx="${270+i*30}" cy="${320}" r="${22-i*4}" fill="#E0E4F8" opacity=".6"/>`).join(""),
    sand:()=>`<path d="M0 250 q150 -30 300 -5 t300 -15 v110 h-600z" fill="#F2D39A"/>`+(()=>{const r=rnd(3);let s="";for(let i=0;i<140;i++)s+=`<circle cx="${(r()*600).toFixed(0)}" cy="${(260+r()*80).toFixed(0)}" r="1.8" fill="#C9A45A"/>`;return s})(),
    blackhole:()=>blackhole(300,170,70),
    finale:()=>rocket(170,170,1.6)+planet(420,150,70,"#E8CF8A","#C9A45A",{stripes:1,ring:"#F5E6B8",ringBack:"#F5E6B8"})+moonPhase(540,280,30,1)
  };
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="${W}" height="${H}" fill="#1B1E4B"/>${g}${A[key]()}</svg>`;
}

/* ---------- Conteúdo dos 30 dias ---------- */
const D=C.days;

/* ---------- Estado ---------- */
const KEY="espaco30-done-"+(new URLSearchParams(location.search).get("c")||"");
let done=[];
try{done=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){done=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}if(window.onSave)window.onSave(done)}

const grid=document.getElementById("grid"),sheet=document.getElementById("sheet"),panel=document.getElementById("panel");
document.getElementById("hero").innerHTML=`<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="300" fill="#1B1E4B"/>${stars(42,600,300,90)}${planet(510,70,40,"#E8CF8A","#C9A45A",{stripes:1,ring:"#F5E6B8",ringBack:"#F5E6B8"})}${rocket(420,120,.9)}${moonPhase(80,60,26,.5)}</svg><div class="txt"><h1>${U.title}</h1><p>${U.sub}</p></div>`;

function render(){
  const next=[...Array(30).keys()].find(i=>!done.includes(i));
  grid.innerHTML=D.map((d,i)=>`<button class="day${done.includes(i)?" done":""}${i===next?" next":""}" data-i="${i}" aria-label="${U.day} ${i+1}: ${d.t}${done.includes(i)?U.doneA:""}"><span class="n">${i+1}</span><span class="e">${d.e}</span></button>`).join("");
  document.getElementById("barFill").style.width=(done.length/30*100)+"%";
  document.getElementById("count").textContent=done.length+" "+U.of+" 30";
  document.getElementById("verCert").hidden=done.length!==30;
}
function open(i){
  const d=D[i],isDone=done.includes(i);
  panel.innerHTML=`<div class="art">${scene(d.a,i*17+5)}<span class="badge">${U.day} ${i+1}</span><button class="close" aria-label="${U.close}">×</button></div>
  <div class="body"><h2>${d.e} ${d.t}</h2>${d.h?`<div class="box story"><h3>📖 ${U.story}</h3><p style="margin:0">${d.h}</p></div>`:""}<p class="fact">${d.f}</p><p class="extra">${U.know} ${d.x}</p>
  <h3 class="more-t">${U.more}</h3><ul class="more">${d.s.map(t=>`<li>${t}</li>`).join("")}</ul>
  <div class="box exp"><h3>🔬 ${U.exp}: ${d.ex.t}</h3><p class="mat">${U.need}: ${d.ex.m}</p><ol>${d.ex.p.map(t=>`<li>${t}</li>`).join("")}</ol></div>
  <div class="box act"><h3>✂️ ${U.act}: ${d.at}</h3><p class="mat">${U.need}: ${d.m}</p><ol>${d.p.map(t=>`<li>${t}</li>`).join("")}</ol></div>
  <div class="box ask"><h3>💬 ${U.ask}</h3><p style="margin:0">${d.q}</p></div></div>
  <div class="row"><button class="btn main" id="mark">${isDone?U.unmark:U.markDone+" ⭐"}</button></div>`;
  sheet.classList.add("open");panel.scrollTop=0;
  panel.querySelector(".close").onclick=close;
  panel.querySelector("#mark").onclick=()=>{done=isDone?done.filter(x=>x!==i):[...done,i];save();render();close();if(!isDone&&done.length===30)showFinale()};
  panel.querySelector(".close").focus();
}
function close(){sheet.classList.remove("open")}
grid.addEventListener("click",e=>{const b=e.target.closest(".day");if(b)open(+b.dataset.i)});
sheet.addEventListener("click",e=>{if(e.target===sheet)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){close();closeFinale()}});
const nome=document.getElementById("nome");
try{nome.value=localStorage.getItem("espaco30-nome")||""}catch(e){}
function showNome(){}
let nomeT;
nome.oninput=()=>{showNome();try{localStorage.setItem("espaco30-nome",nome.value)}catch(e){}clearTimeout(nomeT);nomeT=setTimeout(save,800)};

/* ---------- Desfecho ---------- */
const finale=document.getElementById("finale"),stage=document.getElementById("stage"),fx=document.getElementById("fx");
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let timers=[],fxRun=0;
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function star(cx,cy,r,fill){let d="";for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;d+=(k?"L":"M")+(cx+Math.cos(a)*rr).toFixed(1)+" "+(cy+Math.sin(a)*rr).toFixed(1)}return `<path d="${d}Z" fill="${fill}"/>`}
function certSVG(name,date){
  const F="'Baloo 2','Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif",N="#1E2156";
  const nm=name.trim()||U.Who;
  const fs=Math.max(44,Math.min(92,760/(nm.length*0.56)));
  let row="";for(let k=0;k<30;k++){row+=star(203+k*22.5,548,9,"#FFC93C")}
  return `<svg viewBox="0 0 1056 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(U.c2)}: ${esc(nm)}">
<rect width="1056" height="816" fill="#1B1E4B"/>${stars(11,1056,816,120)}
<rect x="40" y="40" width="976" height="736" rx="30" fill="#FFF8E6" stroke="#FFC93C" stroke-width="8"/>
<rect x="58" y="58" width="940" height="700" rx="22" fill="none" stroke="${N}" stroke-width="2" stroke-dasharray="7 7"/>
${planet(122,122,30,"#E8CF8A","#C9A45A",{stripes:1,ring:"#E6D3A0",ringBack:"#E6D3A0"})}
${planet(930,690,34,"#3C8DFF","#3CC8A4",{land:1})}
${moonPhase(930,130,28,.5)}
${star(120,660,12,"#FFC93C")}${star(160,700,7,"#FF6F7F")}${star(880,110,8,"#FF6F7F")}
<text x="528" y="128" text-anchor="middle" font-family="${F}" font-size="24" font-weight="700" fill="#4A4E8A">${esc(U.c1)}</text>
<text x="528" y="210" text-anchor="middle" font-family="${F}" font-size="70" font-weight="800" fill="${N}" textLength="${Math.min(880,U.c2.length*34)}" lengthAdjust="spacingAndGlyphs">${esc(U.c2)}</text>
<text x="528" y="268" text-anchor="middle" font-family="${F}" font-size="26" font-weight="600" fill="${N}">${esc(U.c3)}</text>
<text x="528" y="${335+fs*0.28}" text-anchor="middle" font-family="${F}" font-size="${fs.toFixed(0)}" font-weight="800" fill="#E8505B">${esc(nm)}</text>
<line x1="218" y1="392" x2="838" y2="392" stroke="${N}" stroke-width="3" stroke-linecap="round"/>
<text x="528" y="448" text-anchor="middle" font-family="${F}" font-size="25" font-weight="600" fill="${N}">${esc(U.c4)}</text>
<text x="528" y="484" text-anchor="middle" font-family="${F}" font-size="25" font-weight="600" fill="${N}">${esc(U.c5)}</text>
${row}
<text x="300" y="668" text-anchor="middle" font-family="${F}" font-size="28" font-weight="700" fill="${N}">${esc(date)}</text>
<line x1="190" y1="684" x2="410" y2="684" stroke="${N}" stroke-width="2"/>
<text x="300" y="712" text-anchor="middle" font-family="${F}" font-size="19" font-weight="700" fill="#4A4E8A">${esc(U.c6)}</text>
<line x1="646" y1="684" x2="866" y2="684" stroke="${N}" stroke-width="2"/>
<text x="756" y="712" text-anchor="middle" font-family="${F}" font-size="19" font-weight="700" fill="#4A4E8A">${esc(U.c7)}</text>
<g transform="translate(528 660) rotate(-8)">
<circle r="70" fill="#E8505B"/><circle r="60" fill="none" stroke="#FFF8E6" stroke-width="3" stroke-dasharray="4 5"/>
${star(0,-26,17,"#FFC93C")}
<text y="12" text-anchor="middle" font-family="${F}" font-size="21" font-weight="800" fill="#fff">${esc(U.s1)}</text>
<text y="36" text-anchor="middle" font-family="${F}" font-size="21" font-weight="800" fill="#fff">${esc(U.s2)}</text></g>
</svg>`}
function confetti(){
  if(calm)return;const ctx=fx.getContext("2d"),dpr=devicePixelRatio||1;
  fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=["#FFC93C","#FF6F7F","#3CC8A4","#8C7BFF","#8FB8FF","#fff"];
  const ps=[...Array(170)].map(()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,v:2+Math.random()*3.5,w:(Math.random()-.5)*1.6,r:4+Math.random()*6,a:Math.random()*6,s:(Math.random()-.5)*.2,c:cols[Math.random()*cols.length|0],st:Math.random()<.4}));
  const id=++fxRun,t0=performance.now();
  (function f(t){if(id!==fxRun)return;ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.y+=p.v;p.x+=p.w+Math.sin((t+p.a*300)/400)*.6;p.a+=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;
      if(p.st){ctx.beginPath();for(let k=0;k<10;k++){const an=-Math.PI/2+k*Math.PI/5,rr=k%2?p.r*.45:p.r;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}ctx.fill()}else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});
    if(t-t0<6500)requestAnimationFrame(f);else ctx.clearRect(0,0,innerWidth,innerHeight)})(t0);
}
function showFinale(){
  timers.forEach(clearTimeout);timers=[];finale.classList.add("open");document.body.style.overflow="hidden";
  if(!nome.value.trim())askName();else launch();
}
function closeFinale(){if(!finale.classList.contains("open"))return;timers.forEach(clearTimeout);timers=[];fxRun++;fx.getContext("2d").clearRect(0,0,fx.width,fx.height);finale.classList.remove("open");document.body.style.overflow=""}
document.getElementById("finaleX").onclick=closeFinale;
document.getElementById("verCert").onclick=()=>{showFinale()};
function askName(){
  stage.innerHTML=`<h2>${U.congrats} 🎉</h2><p>${U.askName}</p><input id="fn" placeholder="${U.namePh}" autocomplete="off" aria-label="${U.namePh}"><div class="row"><button class="btn main" id="fnGo">${U.seeCert}</button></div>`;
  const fn=stage.querySelector("#fn"),go=()=>{if(!fn.value.trim()){fn.focus();return}nome.value=fn.value.trim();try{localStorage.setItem("espaco30-nome",nome.value)}catch(e){}save();launch()};
  stage.querySelector("#fnGo").onclick=go;fn.onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>fn.focus(),50);
}
function launch(){
  if(calm){showCert();return}
  const seq=["3","2","1"];
  seq.forEach((n,k)=>later(()=>{stage.innerHTML=`<p>${U.ready}</p><div class="count">${n}</div>`},k*800));
  later(()=>{stage.innerHTML=`<h2>${U.liftoff}</h2><div class="launch"><svg viewBox="-60 -60 120 150">${rocket(0,0,1)}</svg></div>`},2400);
  later(showCert,3900);
}
function showCert(){
  const nm=nome.value.trim(),date=new Date().toLocaleDateString(U.locale);
  stage.innerHTML=`<h2>${U.cheer}, ${esc(nm||U.who)}!</h2><div class="certwrap" id="certArt">${certSVG(nm,date)}</div><div class="row"><button class="btn main" id="dl" hidden>${U.download}</button><button class="btn sec" id="fin">${U.back}</button></div><div class="msg" id="msg"></div>`;
  stage.querySelector("#fin").onclick=closeFinale;
  confetti();
  (async()=>{try{const dl={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};const b=stage.querySelector("#dl");if(!b)return;b.hidden=false;
    b.onclick=async()=>{const m=stage.querySelector("#msg");m.textContent=U.preparing;
      try{const blob=await toPNG(certSVG(nm,date));await dl.save({filename:U.file,data:blob});m.textContent=U.saved}
      catch(e){m.textContent=e&&e.code==="declined"?"":U.dlFail}}}catch(e){}})();
}
function toPNG(svg){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=2112;c.height=1632;const x=c.getContext("2d");x.drawImage(img,0,0,2112,1632);c.toBlob(b=>b?res(b):rej(new Error("png")),"image/png")}catch(e){rej(e)}};img.onerror=rej;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace("<svg ",'<svg width="1056" height="816" '))})}
showNome();render();
</script>
